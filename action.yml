name: SST Preview Action
description: Deploy SST preview environments and post PR comments

branding:
  icon: cloud
  color: orange

inputs:
  working-directory:
    description: "Directory containing sst.config"
    required: false
    default: "."
  operation:
    description: "Operation to run: auto, deploy, or remove"
    required: false
    default: "auto"
  pr-number:
    description: "Pull request number for manual workflows"
    required: false
    default: ""
  comment-enabled:
    description: "Whether to post PR comment (ignored for remove action)"
    required: false
    default: "true"
  cleanup-on-deploy-failure:
    description: "Remove partially created resources when deploy fails"
    required: false
    default: "true"
  remove-max-attempts:
    description: "Maximum number of remove attempts"
    required: false
    default: "3"
  remove-retry-delay-seconds:
    description: "Delay between remove attempts in seconds"
    required: false
    default: "30"
  verify-removal:
    description: "Verify removal using SST state: auto, true, or false"
    required: false
    default: "auto"

outputs:
  url:
    description: "Deployed CloudFront URL"
    value: ${{ steps.sst.outputs.url }}
  operation:
    description: "Resolved operation"
    value: ${{ steps.sst.outputs.operation }}
  stage:
    description: "SST stage used by the action"
    value: ${{ steps.sst.outputs.stage }}

runs:
  using: composite
  steps:
    - name: Remove pre-installed Pulumi
      if: runner.environment == 'github-hosted'
      shell: bash
      run: rm -f /usr/local/bin/pulumi*

    - name: Run SST
      id: sst
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_CLEANUP_ON_DEPLOY_FAILURE: ${{ inputs.cleanup-on-deploy-failure }}
        INPUT_OPERATION: ${{ inputs.operation }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_REMOVE_MAX_ATTEMPTS: ${{ inputs.remove-max-attempts }}
        INPUT_REMOVE_RETRY_DELAY_SECONDS: ${{ inputs.remove-retry-delay-seconds }}
        INPUT_VERIFY_REMOVAL: ${{ inputs.verify-removal }}
        PR_EVENT_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: '"${{ github.action_path }}/scripts/run-sst.sh"'

    - name: Get short commit sha
      if: steps.sst.outputs.operation == 'deploy' && inputs.comment-enabled == 'true' && github.event_name == 'pull_request'
      id: meta
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: echo "short_sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      if: steps.sst.outputs.operation == 'deploy' && steps.sst.outputs.url != '' && inputs.comment-enabled == 'true' && github.event_name == 'pull_request'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      with:
        message: |
          **Preview Deployed to AWS via [SST](https://www.sst.dev/)**
          ---
          <table>
          <tr><td>Latest commit:</td><td><a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}"><code>${{ steps.meta.outputs.short_sha }}</code></a></td></tr>
          <tr><td>Status:</td><td>✅ Deploy successful!</td></tr>
          <tr><td>Preview URL:</td><td><a href="${{ steps.sst.outputs.url }}">${{ steps.sst.outputs.url }}</a></td></tr>
          </table>
          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View logs</a>
