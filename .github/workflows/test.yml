name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test action script
        shell: bash
        run: |
          node --check scripts/plan-reconciliation.mjs
          node --check scripts/read-sst-output.mjs
          node --check scripts/resolve-dispatch-pull-request.mjs
          node --test tests/action-metadata.test.mjs
          node --test tests/plan-reconciliation.test.mjs
          node --test tests/resolve-dispatch-pull-request.test.mjs
          bash -n scripts/remove-reconciled-stages.sh scripts/run-sst.sh tests/run-sst.test.sh
          ./tests/run-sst.test.sh
